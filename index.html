<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <header class="header">
            <div>
                <p class="eyebrow">STAY ORGANIZED</p>
                <h1>My Todo App</h1>
                <p class="subtitle">Plan your day,one task at a time</p>

            </div>
            <div class="date" id="todayDate"></div>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span class="stat-number" id="totalCount">0</span>
                <span class="stat-label">Total Tasks</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="activeCount">0</span>
                <span class="stat-label">Remaining</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="completedCount">0</span>
                <span class="stat-label">Completed</span>

            </div>
        </section>
        <section class="form-card">
            <h2 id="formTitle">Add a New Task</h2>
            <form id="todoForm">
                <input type="text" id="taskInput" placeholder="What do you need to do?" maxlength="120" required>
                <button type="submit" class="add-btn" id="submitBtn"> + Add Task</button>
            </form>
            <p class="form-hint" id="formHint">Press Enter to add your task</p>
        </section>

        <section class="tasks-section">
            <div class="tasks-heading">
                <h2>Your Tasks</h2>
                <button class="clearCompletedBtn" class="clear-btn">Clear Completed</button>
            </div>

            <div class="toolbar">
                <input type="search" id="searchInput" placeholder="Search tasks...">
            </div>

            <div class="fiters">
                <button class="filter-btn" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="Completed">Completed</button>
            </div>

            <ul id="todoList" class="todo-list"></ul>

            

        </section>
    </main>












    <script src="add.js"></script>
</body>

</html>
